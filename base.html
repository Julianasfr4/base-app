<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f13">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<title>Base — O meu espaço</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://apis.google.com/js/api.js" async defer onload="gapiLoaded()"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
<style>
:root {
  --bg:#0f0f13; --surface:#16161d; --surface2:#1e1e28;
  --elev-1: 0 1px 0 rgba(255,255,255,0.04) inset, 0 2px 8px rgba(0,0,0,0.25);
  --elev-2: 0 1px 0 rgba(255,255,255,0.05) inset, 0 12px 28px rgba(0,0,0,0.35);
  --ease: cubic-bezier(.22,1,.36,1);
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --ink:#eeedf0; --ink-sub:#8b8a96; --ink-ghost:rgba(255,255,255,0.28);
  --accent:#7c6af7; --accent-glow:rgba(124,106,247,0.18); --accent-light:rgba(124,106,247,0.12);
  --casa:#4ade80; --casa-bg:rgba(74,222,128,0.10);
  --fac:#f59e0b;  --fac-bg:rgba(245,158,11,0.10);
  --fam:#f472b6;  --fam-bg:rgba(244,114,182,0.10);
  --ami:#60a5fa;  --ami-bg:rgba(96,165,250,0.10);
  --danger:#f87171; --danger-bg:rgba(248,113,113,0.10);
  --success:#4ade80; --success-bg:rgba(74,222,128,0.12);
  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:24px;
  --font-body:'Plus Jakarta Sans',sans-serif;
  --font-serif:'DM Serif Display',serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;} ::-webkit-scrollbar-track{background:transparent;} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}
h1,h2,h3{font-family:var(--font-serif);font-weight:400;}
button{font-family:var(--font-body);cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:var(--font-body);} select{appearance:none;}

/* ── LAYOUT ── */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh;}

/* ── SIDEBAR ── */
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:28px 18px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;}
.brand-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent) 0%,#a78bfa 100%);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;box-shadow:0 4px 14px rgba(124,106,247,0.35);}
.brand-name{font-family:var(--font-serif);font-size:20px;letter-spacing:-.3px;}
.brand-name span{color:var(--accent);}
.quick-capture{display:flex;flex-direction:column;gap:8px;}
.quick-capture input{width:100%;padding:10px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--ink);font-size:13px;transition:border-color .2s;}
.quick-capture input::placeholder{color:var(--ink-ghost);}
.quick-capture input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
.quick-capture button{padding:9px;background:var(--accent);color:#fff;border-radius:var(--r-sm);font-size:13px;font-weight:600;transition:opacity .15s,transform .1s;}
.quick-capture button:hover{opacity:.85;transform:translateY(-1px);}
.section-label{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-ghost);padding:0 8px;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav button{all:unset;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink-sub);font-size:13.5px;font-weight:500;cursor:pointer;transition:background .15s,color .15s;position:relative;}
.nav button:hover{background:var(--surface2);color:var(--ink);}
.nav button.active{background:var(--accent-light);color:var(--accent);}
.nav button.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--accent);border-radius:0 3px 3px 0;}
.nav-emoji{font-size:15px;line-height:1;flex-shrink:0;}
.week-stats{margin-top:auto;border-top:1px solid var(--border);padding-top:20px;}
.week-stats-title{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-ghost);margin-bottom:14px;}
.bar-row{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.bar-label{width:68px;font-size:11.5px;color:var(--ink-sub);flex-shrink:0;}
.bar-track{flex:1;height:5px;background:var(--surface2);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;transition:width .5s ease;}
.bar-val{width:28px;text-align:right;font-size:11px;color:var(--ink-ghost);font-family:var(--font-mono);flex-shrink:0;}

/* ── CONTEXT HERO ── */
.context-hero{background:linear-gradient(135deg,var(--surface2) 0%,rgba(124,106,247,0.08) 100%);border:1px solid var(--border);border-radius:var(--r-xl);padding:32px 36px;margin-bottom:28px;position:relative;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,0.15);}
.context-hero::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--accent);}
.ch-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:12px;}
.ch-badge-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;box-shadow:0 0 10px var(--accent);animation:pulse 2s infinite;}
.ch-title{font-family:var(--font-serif);font-size:34px;color:var(--ink);line-height:1.2;margin-bottom:22px;letter-spacing:-0.5px;}
.ch-actions{display:flex;gap:12px;flex-wrap:wrap;}
.btn-hero{all:unset;padding:12px 24px;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;background:var(--accent);color:#fff;box-shadow:0 8px 24px var(--accent-glow);display:flex;align-items:center;gap:8px;}
.btn-hero:hover{transform:translateY(-2px);box-shadow:0 12px 32px var(--accent-glow);}
.context-hero.empty-hero{background:var(--surface);background-image:radial-gradient(circle at 100% 0%, rgba(255,255,255,0.02) 0%, transparent 60%);border-color:var(--border);box-shadow:none;}
.context-hero.empty-hero::before{background:var(--border2);}

/* ── DASHBOARD GRID ── */
.dashboard-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start;}
@media(max-width:850px){.dashboard-grid{grid-template-columns:1fr;}}



.btn, .icon-btn, .check, .habit-checkbox { transition: transform .12s var(--ease), opacity .12s, background .15s, border-color .15s; }
.btn:active, .icon-btn:active { transform: scale(.96); }
.check:active, .habit-checkbox:active { transform: scale(.85); }
@keyframes fadeUp{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }
.task, .expense-row, .note-card, .grade-card { animation: fadeUp .35s var(--ease) backwards; }
.glow-focus:focus-within { box-shadow: 0 0 0 1px var(--accent), 0 0 24px -4px var(--accent-glow); }

/* Mobile bottom nav */
@media(max-width:850px){
  .sidebar { display:none !important; }
  .bottom-nav { position:fixed; left:0; right:0; bottom:0; z-index:100; display:flex; justify-content:space-around; align-items:center; padding:12px 6px calc(12px + env(safe-area-inset-bottom,0px)); background:rgba(22,22,29,0.85); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border-top:1px solid var(--border); }
  .bottom-nav button { all:unset; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:64px; justify-content:center; color:var(--ink-ghost); font-size:11px; font-weight:600; cursor:pointer; transition:color .15s var(--ease), transform .15s var(--ease); }
  .bottom-nav button.active { color:var(--accent); transform:translateY(-2px); }
  .bottom-nav .nav-emoji { font-size:22px; margin-bottom:4px;}
  .main { padding-bottom:90px; }
}
@media(min-width:851px){ .bottom-nav { display:none; } }

/* CMDK Palette */
.cmdk-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,15,19,0.7); backdrop-filter:blur(10px); z-index:900; display:none; align-items:flex-start; justify-content:center; padding-top:12vh; }
.cmdk-overlay.open { display:flex; }
.cmdk-modal { background:var(--surface); border:1px solid var(--border2); border-radius:var(--r-xl); width:100%; max-width:560px; box-shadow:0 32px 80px rgba(0,0,0,.6); overflow:hidden; transform:scale(0.98); opacity:0; transition:all .2s var(--ease); }
.cmdk-overlay.open .cmdk-modal { transform:scale(1); opacity:1; }
.cmdk-input { width:100%; padding:20px 24px; background:transparent; border:none; border-bottom:1px solid var(--border); color:var(--ink); font-size:17px; outline:none; font-family:var(--font-body); }
.cmdk-results { max-height:360px; overflow-y:auto; padding:12px; }
.cmdk-item { padding:14px 16px; border-radius:var(--r-sm); cursor:pointer; color:var(--ink-sub); display:flex; align-items:center; gap:12px; font-weight:500; font-size:14px; transition:background .1s, color .1s; }
.cmdk-item:hover { background:var(--surface2); color:var(--accent); }


/* CADERNO CSS */
#cadernoApp {
  height: 100%;
  display: none;
  flex: 1;
  overflow: hidden;
  font-family: -apple-system, sans-serif;
  background: var(--sidebar);
}
:root{
  --paper:#FDFBF6; --line:#E3D9C6; --line-strong:#D8CBAE; --ink:#2B2620; --muted:#948569;
  --accent:#2E6E75; --accent-2:#C1783A; --sidebar:#F4EEE0; --card:#FFFFFF;
  --danger:#B24444; --shadow:rgba(60,50,30,.12);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1E1B15; --line:#332C1F; --line-strong:#443A28; --ink:#EDE6D6; --muted:#93876E;
    --accent:#57ADB5; --accent-2:#E0995F; --sidebar:#15130F; --card:#242019; --shadow:rgba(0,0,0,.35);
  }
}
#cadernoApp {
  --paper:#1E1B15; --line:#332C1F; --line-strong:#443A28; --ink:#EDE6D6; --muted:#93876E;
  --accent:#57ADB5; --accent-2:#E0995F; --sidebar:#15130F; --card:#242019; --shadow:rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,#cadernoApp {height:100%;margin:0;}
#cadernoApp {font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--sidebar); color:var(--ink); overflow:hidden;}
#app{display:flex; height:100%;}
#sidebar{width:270px; min-width:270px; background:var(--sidebar); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:calc(14px + env(safe-area-inset-top,0px)) 12px 12px; transition:margin-left .2s ease;}
#sidebar h1{font:700 13px/1 -apple-system,sans-serif; letter-spacing:1px; margin:0 6px 12px; color:var(--muted); text-transform:uppercase;}
#newNoteBtn{background:var(--accent); color:#fff; border:none; border-radius:12px; padding:11px 12px; font:600 14px/1 -apple-system,sans-serif; cursor:pointer; margin-bottom:8px; box-shadow:0 2px 6px var(--shadow);}
#newNoteBtn:active{transform:scale(.98);}
.import-row{display:flex; gap:6px; margin-bottom:10px;}
.import-btn{flex:1; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 6px; font:600 12px -apple-system,sans-serif; cursor:pointer; color:var(--ink);}
#searchInput{margin:0 0 10px; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:13px -apple-system,sans-serif; outline:none;}
#noteList{overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:8px;}
.note-item{background:var(--card); border-radius:14px; padding:0; cursor:pointer; overflow:hidden; box-shadow:0 1px 3px var(--shadow); border:1px solid var(--line); display:flex; gap:0;}
.note-item.active{outline:2px solid var(--accent); outline-offset:-2px;}
.note-item .tab{width:6px; background:var(--tab,var(--accent));}
.note-item .#cadernoApp {padding:10px 12px; min-width:0; flex:1;}
.note-item .t{font:600 14px/1.3 Georgia,"Iowan Old Style",serif; margin:0 0 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.note-item .d{font:11px/1 -apple-system,sans-serif; color:var(--muted);}
#empty-hint{color:var(--muted); font-size:13px; padding:16px 6px;}
#sync-status{font:11px -apple-system,sans-serif; color:var(--muted); padding:10px 6px 0; display:flex; gap:6px; align-items:center;}
#sync-dot{width:7px;height:7px;border-radius:50%;background:#5B8A5B;}
#sync-dot.off{background:var(--danger);}

#editor{flex:1; display:flex; flex-direction:column; min-width:0;}
#toolbar{display:flex; align-items:center; gap:6px; padding:8px 12px; margin:10px 12px 0; border-radius:16px; background:var(--card); box-shadow:0 2px 10px var(--shadow); flex-wrap:wrap;}
#menuBtn{display:none; background:none; border:none; color:var(--ink); font-size:20px; cursor:pointer; padding:2px 6px;}
#titleInput{font:600 15px/1 Georgia,"Iowan Old Style",serif; border:none; background:transparent; color:var(--ink); flex:1; min-width:70px; outline:none;}
.tool-btn{width:34px; height:34px; border-radius:9px; border:1px solid transparent; background:none; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink); font-size:16px;}
.tool-btn.active{background:var(--line); border-color:var(--accent);}
.swatch{width:19px; height:19px; border-radius:50%; border:2px solid transparent; cursor:pointer;}
.swatch.active{border-color:var(--ink); transform:scale(1.15);}
.w-btn{width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:var(--card); cursor:pointer; display:flex; align-items:center; justify-content:center;}
.w-btn.active{border-color:var(--accent); border-width:2px;}
.w-btn span{background:var(--ink); border-radius:50%; display:block;}
#divider{width:1px; height:22px; background:var(--line); margin:0 4px;}
#deleteNoteBtn{color:var(--danger);}
select#paperStyle{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; font:12px -apple-system,sans-serif; padding:4px 6px;}
.pcolor{width:19px;height:19px;border-radius:6px;border:2px solid var(--line);cursor:pointer;}
.pcolor.active{border-color:var(--ink);}
#palmBadge{font:10px -apple-system,sans-serif; color:var(--accent); border:1px solid var(--accent); border-radius:20px; padding:2px 8px; display:none; white-space:nowrap;}
#palmBadge.on{display:inline-block;}

#pageStrip{display:flex; gap:8px; align-items:center; padding:8px 24px 0; overflow-x:auto;}
.page-pill{padding:6px 12px; border-radius:20px; background:var(--card); border:1px solid var(--line); font:12px -apple-system,sans-serif; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px; box-shadow:0 1px 2px var(--shadow);}
.page-pill.active{border-color:var(--accent); background:var(--line); font-weight:600;}
.page-pill .del{color:var(--danger); font-size:11px; cursor:pointer;}
#addPageBtn{padding:6px 12px; border-radius:20px; background:none; border:1px dashed var(--muted); color:var(--muted); font:12px -apple-system,sans-serif; cursor:pointer; white-space:nowrap;}

#canvasWrap{flex:1; position:relative; overflow:auto; margin:10px 12px 12px; border-radius:16px; box-shadow:0 2px 10px var(--shadow); background-color:var(--pc,var(--paper));}
#canvasWrap.style-lines{background-image:repeating-linear-gradient(var(--pc,var(--paper)) 0 31px, var(--line) 31px 32px); background-size:100% 32px;}
#canvasWrap.style-grid{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px); background-size:26px 26px;}
#canvasWrap.style-dots{background-image:radial-gradient(var(--line-strong) 1.3px,transparent 1.3px); background-size:24px 24px;}
#canvasWrap.style-blank{background-image:none;}
#canvas{position:absolute; top:0; left:0; width:100%; height:1400px; touch-action:none;}
#bgLayer{position:absolute; top:0; left:0; display:none; pointer-events:none;}
.txt-box{position:absolute; min-width:40px; min-height:22px; font:20px/1.35 Georgia,"Iowan Old Style",serif; outline:none; padding:2px; white-space:pre-wrap;}
#placeholder{display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted); font:15px -apple-system,sans-serif; flex-direction:column; gap:10px; text-align:center; padding:20px;}
#toast{position:fixed; bottom:18px; right:18px; background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:10px; font:12px -apple-system,sans-serif; opacity:0; pointer-events:none; transition:opacity .2s; z-index:30;}
#toast.show{opacity:1;}
::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
@media (max-width:720px){
  #sidebar{position:fixed; z-index:5; height:100%; margin-left:-270px; box-shadow:2px 0 12px rgba(0,0,0,.15);}
  #sidebar.open{margin-left:0;}
  #menuBtn{display:flex;}
}

/* ── WEATHER & HABITS & GRADES ── */
.weather-widget { display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-sub); background:var(--surface2); padding:6px 14px; border-radius:99px; margin-bottom: 24px; border:1px solid var(--border); }
.habit-row { display:flex; align-items:center; justify-content:space-between; padding:12px; border-bottom:1px solid var(--border); }
.habit-row:last-child { border-bottom:none; }
.habit-info { display:flex; align-items:center; gap:12px; font-weight: 500; cursor:pointer;}
.habit-streak { font-size:12px; color:var(--accent); font-weight:700; display:flex; align-items:center; gap:4px; background:var(--accent-light); padding:2px 8px; border-radius:99px; }
.habit-checkbox { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border2); display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.habit-checkbox.done { background: var(--accent); border-color: var(--accent); color: #fff; }
.chart-container { width:100%; max-height:250px; margin-bottom:24px; display:flex; justify-content:center; }
.grade-card { background:var(--surface2); padding:16px; border-radius:var(--r); margin-bottom:12px; border:1px solid var(--border); }
.grade-header { display:flex; justify-content:space-between; margin-bottom: 12px; align-items:center; }
.grade-header h3 { font-size: 16px; font-family: var(--font-serif); }
.grade-avg { font-size: 18px; font-weight: 700; color: var(--accent); }
.grade-row { display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px dashed var(--border); color: var(--ink-sub); }
.grade-row:last-child { border-bottom:none; }


/* ── SAMSUNG NOTES FEATURES ── */
.paper-ruled { background-image: repeating-linear-gradient(transparent, transparent 31px, var(--border2) 31px, var(--border2) 32px) !important; background-attachment: local !important; }
.paper-grid { background-image: linear-gradient(var(--border2) 1px, transparent 1px), linear-gradient(90deg, var(--border2) 1px, transparent 1px) !important; background-size: 24px 24px !important; }
.paper-dotted { background-image: radial-gradient(var(--ink-sub) 1.5px, transparent 1.5px) !important; background-size: 24px 24px !important; }

.draw-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--surface); z-index:600; display:none; flex-direction:column; }
.draw-overlay.open { display:flex; }
.draw-tools { height:60px; border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 24px; gap:16px; background:var(--surface2); }
.draw-canvas-container { flex:1; position:relative; overflow:hidden; background:#fff; cursor:crosshair; }
#drawCanvas { position:absolute; top:0; left:0; touch-action: none; }

.fac-editor img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); margin: 8px 0; }
.fac-editor audio { outline: none; border-radius: 24px; margin: 8px 0; max-width:100%; }
/* ── MAIN ── */


.main{padding:40px 48px;max-width:960px;width:100%;}
.page-header{margin-bottom:32px;}
.page-eyebrow{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
.page-title{font-family:var(--font-serif);font-size:38px;line-height:1.1;letter-spacing:-.5px;}
.page-title em{font-style:italic;color:var(--accent);}
.page-sub{margin-top:8px;font-size:13.5px;color:var(--ink-sub);}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px 24px;margin-bottom:20px;transition:border-color .2s;}
.card:hover{border-color:var(--border2);}
.card-title{font-size:13px;font-weight:600;color:var(--ink-sub);letter-spacing:.3px;margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.card-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* ── GCAL BAR ── */
.gcal-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);margin-bottom:24px;gap:12px;flex-wrap:wrap;}
.gcal-bar-left{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;}
.gcal-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-ghost);flex-shrink:0;}
.gcal-bar-right{display:flex;gap:8px;}
.gcal-action-btn{all:unset;padding:7px 14px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--ink-sub);transition:all .15s;}
.gcal-action-btn:hover{border-color:var(--border2);color:var(--ink);}
.gcal-action-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 14px var(--accent-glow);}
.gcal-action-btn.primary:hover{opacity:.85;}
.gcal-action-btn.danger:hover{border-color:var(--danger);color:var(--danger);}
.gcal-loading{font-size:12px;color:var(--ink-ghost);animation:pulse 1.5s ease infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* ── TASKS ── */
.task-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;}
.task{display:flex;align-items:flex-start;gap:13px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);transition:border-color .2s,transform .1s;position:relative;overflow:hidden;}
.task::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cat-color,var(--accent));}
.task:hover{border-color:var(--border2);transform:translateX(2px);}
.task.done{opacity:.45;} .task.done .task-title{text-decoration:line-through;}
.check{width:18px;height:18px;border:1.5px solid var(--border2);border-radius:5px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;background:transparent;cursor:pointer;transition:background .15s,border-color .15s;font-size:11px;color:#fff;}
.check:hover{border-color:var(--accent);} .check.checked{background:var(--accent);border-color:var(--accent);}
.task-body{flex:1;min-width:0;}
.task-title{font-size:14px;font-weight:500;color:var(--ink);line-height:1.45;}
.task-meta{display:flex;gap:8px;margin-top:5px;flex-wrap:wrap;align-items:center;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.3px;background:var(--accent-light);color:var(--accent);}
.tag.cat-casa{background:var(--casa-bg);color:var(--casa);}
.tag.cat-faculdade{background:var(--fac-bg);color:var(--fac);}
.tag.cat-familia{background:var(--fam-bg);color:var(--fam);}
.tag.cat-amigos{background:var(--ami-bg);color:var(--ami);}
.tag.urgent{background:var(--danger-bg);color:var(--danger);}
.meta-txt{font-size:12px;color:var(--ink-sub);}
.task-actions{display:flex;gap:6px;flex-shrink:0;margin-top:1px;}
.icon-btn{all:unset;padding:5px 11px;border-radius:var(--r-sm);font-size:12px;font-weight:500;color:var(--ink-sub);background:var(--surface2);cursor:pointer;transition:color .15s,background .15s;}
.icon-btn:hover{color:var(--ink);background:var(--border2);}
.icon-btn.primary{background:var(--accent-light);color:var(--accent);}
.icon-btn.primary:hover{background:var(--accent);color:#fff;}
.icon-btn.danger:hover{background:var(--danger-bg);color:var(--danger);}
.empty{padding:48px 20px;text-align:center;color:var(--ink-ghost);font-size:13.5px;border:1px dashed var(--border);border-radius:var(--r-lg);}
.empty-icon{font-size:32px;margin-bottom:10px;display:block;}

/* ── FORMS ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:11.5px;font-weight:600;color:var(--ink-sub);letter-spacing:.4px;}
.field input,.field select,.field textarea{padding:10px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--ink);font-size:13.5px;transition:border-color .2s,box-shadow .2s;}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-ghost);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
.field select option{background:var(--surface2);}
.field textarea{resize:vertical;min-height:80px;}
.full-span{grid-column:1/-1;}
.form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}
.btn{all:unset;cursor:pointer;padding:10px 22px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;transition:opacity .15s,transform .1s;}
.btn:hover{opacity:.85;transform:translateY(-1px);} .btn:active{transform:translateY(0);}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px var(--accent-glow);}
.btn-ghost{background:var(--surface2);color:var(--ink-sub);}
.btn-sm{padding:7px 14px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

/* ── IDEAS ── */
.idea-row{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;transition:border-color .2s;}
.idea-row:hover{border-color:var(--border2);}
.idea-bullet{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.idea-text{flex:1;font-size:13.5px;}
.idea-actions{display:flex;gap:7px;align-items:center;}
.idea-actions select{padding:5px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--ink-sub);font-size:12px;cursor:pointer;}
.idea-actions select:focus{outline:none;border-color:var(--accent);}

/* ── MONEY ── */
.money-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:24px;}
.money-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;transition:border-color .2s;}
.money-card:hover{border-color:var(--border2);}
.money-card .label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-ghost);margin-bottom:8px;}
.money-card .value{font-family:var(--font-mono);font-size:26px;font-weight:500;color:var(--ink);line-height:1.2;}
.money-card .value.positive{color:var(--casa);} .money-card .value.negative{color:var(--danger);}
.goal-bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:10px;}
.goal-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease;}
.goal-fill.over{background:var(--danger);}
.goal-input{background:transparent;border:none;color:var(--ink);font-family:var(--font-mono);font-size:24px;width:100%;padding:0;}
.goal-input:focus{outline:none;} .goal-input::placeholder{color:var(--ink-ghost);}
.expense-list{display:flex;flex-direction:column;gap:6px;}
.expense-row{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);transition:border-color .2s;}
.expense-row:hover{border-color:var(--border2);}
.expense-date{font-size:11.5px;color:var(--ink-ghost);font-family:var(--font-mono);width:50px;flex-shrink:0;}
.expense-desc{flex:1;font-size:13.5px;display:flex;align-items:center;gap:8px;}
.expense-amount{font-family:var(--font-mono);font-size:14px;color:var(--danger);flex-shrink:0;}

/* ── TODAY STRIP ── */
.today-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px;}
.strip-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;}
.strip-card .sc-label{font-size:11px;color:var(--ink-ghost);font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px;}
.strip-card .sc-value{font-family:var(--font-mono);font-size:22px;color:var(--ink);font-weight:500;}
.strip-card .sc-sub{font-size:11px;color:var(--ink-sub);margin-top:2px;}

/* ── CALENDAR ── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.cal-month-label{font-family:var(--font-serif);font-size:22px;letter-spacing:-.3px;}
.cal-nav-btns{display:flex;gap:6px;align-items:center;}
.cal-nav-btn{all:unset;padding:7px 14px;border-radius:var(--r-sm);background:var(--surface2);color:var(--ink-sub);font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,color .15s;}
.cal-nav-btn:hover{background:var(--accent-light);color:var(--accent);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:24px;}
.cal-weekday{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-ghost);text-align:center;padding:8px 4px;}
.cal-day{min-height:80px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;transition:border-color .2s,background .15s;position:relative;}
.cal-day:hover{border-color:var(--border2);background:var(--surface2);}
.cal-day.other-month{opacity:.3;}
.cal-day.today{border-color:var(--accent);}
.cal-day.selected{background:var(--accent-light);border-color:var(--accent);}
.cal-day-num{font-size:12.5px;font-weight:600;color:var(--ink-sub);margin-bottom:4px;line-height:1;}
.cal-events-dots{display:flex;flex-direction:column;gap:2px;margin-top:2px;}
.cal-ev-pill{font-size:10px;font-weight:600;padding:2px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;}
.day-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:20px;}
.day-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.day-panel-title{font-family:var(--font-serif);font-size:18px;}
.ev-list{display:flex;flex-direction:column;gap:8px;}
.ev-row{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);position:relative;overflow:hidden;}
.ev-row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ev-color,var(--accent));}
.ev-time{font-family:var(--font-mono);font-size:12px;color:var(--ink-sub);flex-shrink:0;margin-top:1px;min-width:38px;}
.ev-body{flex:1;}
.ev-title{font-size:13.5px;font-weight:500;}
.ev-loc{font-size:11.5px;color:var(--ink-sub);margin-top:2px;}

/* ── GENERAL NOTES ── */
.notes-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.notes-search{flex:1;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--ink);font-size:13.5px;transition:border-color .2s;}
.notes-search::placeholder{color:var(--ink-ghost);}
.notes-search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.note-card{border-radius:var(--r-lg);padding:18px;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;min-height:130px;display:flex;flex-direction:column;gap:8px;border:1px solid transparent;}
.note-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,0.4);}
.note-card.pinned::after{content:'📌';position:absolute;top:10px;right:12px;font-size:13px;}
.note-card-title{font-size:14px;font-weight:600;word-break:break-word;}
.note-card-body{font-size:13px;flex:1;opacity:.8;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;word-break:break-word;white-space:pre-wrap;}
.note-card-date{font-size:11px;opacity:.5;margin-top:auto;}
.nc-default{background:var(--surface);border-color:var(--border);color:var(--ink);}
.nc-yellow{background:#2b2200;border-color:#4a3800;color:#fde68a;}
.nc-green{background:#002b14;border-color:#00472a;color:#6ee7b7;}
.nc-blue{background:#00102e;border-color:#00214d;color:#93c5fd;}
.nc-pink{background:#2b0015;border-color:#4a0026;color:#f9a8d4;}
.nc-purple{background:#170020;border-color:#2e0042;color:#d8b4fe;}
.note-add-card{border-radius:var(--r-lg);padding:18px;cursor:pointer;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-ghost);font-size:13.5px;font-weight:500;min-height:130px;transition:border-color .2s,color .2s;}
.note-add-card:hover{border-color:var(--accent);color:var(--accent);}

/* ── GENERAL NOTE MODAL ── */
.note-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.note-overlay.open{display:flex;}
.note-modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-xl);width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,0.5);}
.note-modal-top{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--border);}
.note-modal-title-input{flex:1;background:transparent;border:none;color:var(--ink);font-size:18px;font-weight:600;font-family:var(--font-body);}
.note-modal-title-input::placeholder{color:var(--ink-ghost);}
.note-modal-title-input:focus{outline:none;}
.note-modal-body{flex:1;overflow-y:auto;padding:0 22px;}
.note-modal-textarea{width:100%;background:transparent;border:none;color:var(--ink);font-size:14px;line-height:1.8;padding:18px 0;resize:none;min-height:300px;}
.note-modal-textarea::placeholder{color:var(--ink-ghost);}
.note-modal-textarea:focus{outline:none;}
.note-modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.color-picker{display:flex;gap:6px;align-items:center;}
.color-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s;}
.color-dot:hover{transform:scale(1.2);} .color-dot.sel{border-color:#fff;transform:scale(1.15);}
.note-modal-actions{margin-left:auto;display:flex;gap:8px;}

/* ═══════════════════════════════════════════
   SAMSUNG NOTES — FACULDADE
═══════════════════════════════════════════ */
.fac-divider{display:flex;align-items:center;gap:14px;margin:36px 0 26px;}
.fac-divider-line{flex:1;height:1px;background:var(--border);}
.fac-divider-label{font-family:var(--font-serif);font-size:22px;color:var(--ink);letter-spacing:-.3px;}

/* Drive sync bar */
.drive-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-radius:var(--r);background:var(--surface2);border:1px solid var(--border);margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.drive-bar-left{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-sub);}
.drive-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-ghost);flex-shrink:0;}
.drive-bar.connected .drive-dot{background:var(--success);box-shadow:0 0 5px var(--success);}
.drive-bar.connected .drive-bar-left{color:var(--success);}
.drive-action-btn{all:unset;padding:5px 12px;border-radius:var(--r-sm);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--ink-sub);transition:all .15s;}
.drive-action-btn:hover{border-color:var(--border2);color:var(--ink);}
.drive-action-btn.primary{background:var(--fac);color:#000;border-color:var(--fac);}
.drive-action-btn.primary:hover{opacity:.85;}

/* Fac search & cats */
.fac-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.fac-search{flex:1;min-width:180px;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--ink);font-size:13px;transition:border-color .2s;}
.fac-search::placeholder{color:var(--ink-ghost);}
.fac-search:focus{outline:none;border-color:var(--fac);box-shadow:0 0 0 3px rgba(245,158,11,.12);}
.fac-cats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px;}
.fac-cat{all:unset;padding:5px 13px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--ink-sub);transition:all .15s;}
.fac-cat:hover{border-color:var(--fac);color:var(--fac);}
.fac-cat.active{background:var(--fac);color:#000;border-color:var(--fac);}

/* Fac note cards grid */
.fac-notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:13px;}
.fac-note-card{border-radius:16px;padding:16px;cursor:pointer;transition:transform .15s,box-shadow .2s;position:relative;min-height:140px;display:flex;flex-direction:column;gap:6px;border:1px solid transparent;}
.fac-note-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,0.45);}
.fac-note-card.pinned::after{content:'📌';position:absolute;top:10px;right:12px;font-size:12px;}
.fac-note-card-cat{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;opacity:.6;margin-bottom:2px;}
.fac-note-card-title{font-size:14px;font-weight:700;line-height:1.35;word-break:break-word;}
.fac-note-card-body{font-size:12.5px;flex:1;opacity:.7;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;line-height:1.6;}
.fac-note-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;}
.fac-note-card-date{font-size:10.5px;opacity:.45;}
.fac-add-card{border-radius:16px;padding:16px;cursor:pointer;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--ink-ghost);min-height:140px;transition:border-color .2s,color .2s;}
.fac-add-card:hover{border-color:var(--fac);color:var(--fac);}
.fac-add-card-icon{font-size:24px;}

/* ── FAC NOTE EDITOR MODAL ── */
.fac-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:110;padding:20px;}
.fac-overlay.open{display:flex;}
.fac-modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-xl);width:100%;max-width:780px;height:90vh;max-height:860px;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,0.6);}

/* Modal header */
.fac-modal-header{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--border);}
.fac-modal-title{flex:1;background:transparent;border:none;color:var(--ink);font-size:20px;font-weight:700;font-family:var(--font-body);}
.fac-modal-title::placeholder{color:var(--ink-ghost);}
.fac-modal-title:focus{outline:none;}
.fac-modal-header-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.fac-hbtn{all:unset;padding:6px 11px;border-radius:var(--r-sm);font-size:12px;font-weight:600;cursor:pointer;background:var(--surface2);color:var(--ink-sub);border:1px solid var(--border);transition:all .15s;}
.fac-hbtn:hover{border-color:var(--border2);color:var(--ink);}
.fac-hbtn.save{background:var(--fac);color:#000;border-color:var(--fac);}
.fac-hbtn.save:hover{opacity:.85;}
.fac-hbtn.danger:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger);}
.fac-hbtn.pin.active{background:rgba(245,158,11,.2);color:var(--fac);border-color:var(--fac);}

/* Meta row (category + color) */
.fac-modal-meta{display:flex;align-items:center;gap:12px;padding:10px 22px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.fac-modal-cat-select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--ink-sub);font-size:12.5px;padding:5px 10px;cursor:pointer;font-family:var(--font-body);}
.fac-modal-cat-select:focus{outline:none;border-color:var(--fac);}
.fac-modal-cat-select option{background:var(--surface2);}
.fac-color-dots{display:flex;gap:5px;}
.fac-cdot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s;flex-shrink:0;}
.fac-cdot:hover{transform:scale(1.25);}
.fac-cdot.sel{border-color:#fff;transform:scale(1.2);}

/* Formatting toolbar */
.fac-fmt-toolbar{display:flex;align-items:center;gap:2px;padding:8px 22px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:rgba(255,255,255,0.02);}
.fac-fmt-btn{all:unset;width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-sub);transition:background .12s,color .12s;}
.fac-fmt-btn:hover{background:var(--surface2);color:var(--ink);}
.fac-fmt-btn.active{background:var(--fac-bg);color:var(--fac);}

    const res=await window.storage.get('base-data',false);
    if(res&&res.value) {
       const parsed = JSON.parse(res.value);
       data = Object.assign(data, parsed);
       // Re-assign default habits if missing
       if(!parsed.habits || !Array.isArray(parsed.habits)) data.habits = defaultData.habits;
       if(!parsed.subjects || !Array.isArray(parsed.subjects)) data.subjects = [];
       if(!parsed.incomes || !Array.isArray(parsed.incomes)) data.incomes = [];
    }
  }catch(e){ console.log('A começar do zero.'); }
  if(!Array.isArray(data.facNotes)) data.facNotes=[];
  selectedDay=todayISO();
  render();
}
async function saveData(){
  try{ await window.storage.set('base-data',JSON.stringify(data),false); }
  catch(e){ console.error('Erro ao guardar',e); }
}

const tabColors=['#2E6E75','#C1783A','#5B7A5B','#9C3B3B','#4A6FA5'];
function tabFor(id){let h=0; for(const c of id) h=(h*31+c.charCodeAt(0))>>>0; return tabColors[h%tabColors.length];}

/* --- migração: garante que toda a nota tem "pages" (páginas) --- */
function normalizeNote(n){
  if(!n.pages || !n.pages.length){
    n.pages=[{strokes:n.strokes||[], texts:n.texts||[], paper:n.paper||'lines', color:n.color||'#FDFBF6'}];
  }
  if(typeof n.currentPage!=='number' || n.currentPage<0 || n.currentPage>=n.pages.length) n.currentPage=0;
  return n;
}
function curPage(){ const n=notes[currentId]; return n ? n.pages[n.currentPage] : null; }
function pageKey(){ return currentId+':'+(notes[currentId]?notes[currentId].currentPage:0); }

/* --- Rejeição de palma (heurística para S Pen / caneta) --- */
let penActiveUntil=0;
function markPenActive(){ penActiveUntil=Date.now()+700; showPalmBadge(true); clearTimeout(markPenActive._t); markPenActive._t=setTimeout(()=>showPalmBadge(false),700); }
function showPalmBadge(on){ document.getElementById('palmBadge').classList.toggle('on', on); }
function shouldIgnoreTouch(e){ return e.pointerType==='touch' && Date.now()<penActiveUntil; }

window.renderList = function(){

function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function applyPageColor(hex){ canvasWrap.style.setProperty('--pc', hex); }

function renderPageStrip(){
  const strip=document.getElementById('pageStrip');
  const n=notes[currentId];
  strip.innerHTML='';

  n.pages.forEach((pg,i)=>{
    const pill=document.createElement('div');

    pill.onclick=(e)=>{

function drawAll(){
  const p=curPage(); if(!p) return;
  const bg=document.getElementById('bgLayer'), svg=document.getElementById('canvas');
  if(p.bg){
    bg.src=p.bg; bg.style.display='block'; bg.style.width=p.bgW+'px'; bg.style.height=p.bgH+'px';
    svg.style.width=p.bgW+'px'; svg.style.height=p.bgH+'px';
  } else {
    bg.style.display='none'; svg.style.width='100%'; svg.style.height='1400px';
  }
  const g=document.getElementById('strokesGroup'); if(!g) return;
  g.innerHTML='';
  (p.strokes||[]).forEach(s=>{
    const pl=document.createElementNS('http://www.w3.org/2000/svg','polyline');
    pl.setAttribute('points',s.pts);
    pl.setAttribute('fill','none');
    pl.setAttribute('stroke',s.color);
    pl.setAttribute('stroke-width',s.tool==='highlighter'?s.w*4:s.w);
    pl.setAttribute('stroke-linecap','round');
    pl.setAttribute('stroke-linejoin','round');
    pl.setAttribute('opacity',s.tool==='highlighter'?0.35:1);
    pl.style.cursor='pointer';
    pl.onclick=(e)=>{ if(tool==='eraser'){ e.stopPropagation(); eraseStroke(s.id);} };
    g.appendChild(pl);
  });
  const layer=document.getElementById('textLayer'); if(!layer) return;
  layer.innerHTML='';
  (p.texts||[]).forEach(t=>{
    const d=document.createElement('div');
    d.className='txt-box'; d.contentEditable='true'; d.style.left=t.x+'px'; d.style.top=t.y+'px'; d.style.color=t.color;
    if(t.width) d.style.width=t.width+'px';
    d.innerText=t.text;
    d.onblur=()=>{ t.text=d.innerText; if(!t.text.trim()){ p.texts=p.texts.filter(x=>x.id!==t.id); drawAll(); } save();};
    layer.appendChild(d);
  });
}

function eraseStroke(id){
  const p=curPage();
  pushUndo();
  p.strokes=p.strokes.filter(s=>s.id!==id);
  drawAll(); save();
}
function pushUndo(){
  const k=pageKey(); const p=curPage(); if(!p) return;
  undoStack[k]=undoStack[k]||[];
  undoStack[k].push(JSON.stringify({strokes:p.strokes,texts:p.texts}));
  if(undoStack[k].length>40) undoStack[k].shift();
}
document.getElementById('undoBtn').onclick=()=>{
  if(!currentId) return;
  const k=pageKey(); const st=undoStack[k];
  if(!st||!st.length) return;
  const prev=JSON.parse(st.pop());
  const p=curPage(); p.strokes=prev.strokes; p.texts=prev.texts;
  drawAll(); save();
};

let drawing=false, curPts=[], tempPl=null, activePointerId=null;
function attachCanvasEvents(){
  const svg=document.getElementById('canvas');
  svg.onpointerdown=(e)=>{
    if(e.pointerType==='pen') markPenActive();
    if(shouldIgnoreTouch(e)) return;
    if(tool==='eraser') return;
    if(drawing) return;
    const r=svg.getBoundingClientRect();
    const x=e.clientX-r.left+svg.parentElement.scrollLeft, y=e.clientY-r.top+svg.parentElement.scrollTop;
    if(tool==='text'){ addText(x,y); return; }
    drawing=true; activePointerId=e.pointerId; curPts=[[x,y]];
    tempPl=document.createElementNS('http://www.w3.org/2000/svg','polyline');
    tempPl.setAttribute('fill','none'); tempPl.setAttribute('stroke',color);
    tempPl.setAttribute('stroke-width',tool==='highlighter'?wPx*4:wPx);
    tempPl.setAttribute('opacity',tool==='highlighter'?0.35:1);
    tempPl.setAttribute('stroke-linecap','round'); tempPl.setAttribute('stroke-linejoin','round');
    document.getElementById('strokesGroup').appendChild(tempPl);
    svg.setPointerCapture(e.pointerId);
  };
  svg.onpointermove=(e)=>{
    if(e.pointerType==='pen') markPenActive();
    if(!drawing || e.pointerId!==activePointerId) return;
    if(shouldIgnoreTouch(e)) return;
    const r=svg.getBoundingClientRect();
    const x=e.clientX-r.left+svg.parentElement.scrollLeft, y=e.clientY-r.top+svg.parentElement.scrollTop;
    curPts.push([x,y]);
    tempPl.setAttribute('points',curPts.map(p=>p.join(',')).join(' '));
  };
  svg.onpointerup=(e)=>{
    if(!drawing || (activePointerId!==null && e.pointerId!==activePointerId)) return;
    drawing=false; activePointerId=null;
    if(curPts.length>1){
      pushUndo();
      const p=curPage();
      p.strokes=p.strokes||[];
      p.strokes.push({id:'s'+Date.now()+Math.random().toString(36).slice(2,7), pts:curPts.map(pt=>pt.join(',')).join(' '), color, w:wPx, tool});
      save();
    }
    curPts=[]; tempPl=null;
  };
  svg.onpointercancel=svg.onpointerup;
}
function addText(x,y){
  const p=curPage(); p.texts=p.texts||[];
  pushUndo();
  const t={id:'t'+Date.now(), x, y, text:'', color};
  p.texts.push(t);
  drawAll(); save();
  setTimeout(()=>{ const boxes=document.querySelectorAll('.txt-box'); const last=boxes[boxes.length-1]; if(last) last.focus(); },30);
}

/* --- Importar PDF: cada página do PDF vira uma página da nota, como imagem de fundo para anotares por cima --- */
document.getElementById('importPdfBtn').onclick=()=>document.getElementById('importPdfInput').click();
document.getElementById('importPdfInput').onchange=async(e)=>{
  const file=e.target.files[0]; e.target.value=''; if(!file) return;
  if(!window.pdfjsLib){ alert('O importador de PDF não carregou. Tenta novamente.'); return; }
  showLoading('A importar PDF…');
  try{
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    const pages=[];
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const viewport=page.getViewport({scale:1.3});
      const c=document.createElement('canvas'); c.width=viewport.width; c.height=viewport.height;
      await page.render({canvasContext:c.getContext('2d'), viewport}).promise;
      pages.push({strokes:[], texts:[], paper:'blank', color:'#FFFFFF', bg:c.toDataURL('image/jpeg',0.75), bgW:viewport.width, bgH:viewport.height});
    }
    await createNoteFromData({title:file.name.replace(/\.pdf$/i,''), pages, currentPage:0, updatedAt:Date.now(), createdAt:Date.now()});
  }catch(err){ alert('Não foi possível importar este PDF.'); }
  hideLoading();
};

/* --- Importar Word (.docx): texto extraído e paginado automaticamente --- */
document.getElementById('importDocxBtn').onclick=()=>document.getElementById('importDocxInput').click();
document.getElementById('importDocxInput').onchange=async(e)=>{
  const file=e.target.files[0]; e.target.value=''; if(!file) return;
  if(!window.mammoth){ alert('O importador de Word não carregou. Tenta novamente.'); return; }
  showLoading('A importar Word…');
  try{
    const buf=await file.arrayBuffer();
    const result=await mammoth.extractRawText({arrayBuffer:buf});
    const text=(result.value||'').trim();
    const chunkSize=1500;
    const chunks=[]; for(let i=0;i<text.length;i+=chunkSize) chunks.push(text.slice(i,i+chunkSize));
    if(!chunks.length) chunks.push('');
    const pages=chunks.map(c=>({strokes:[], texts:[{id:'t'+Date.now()+Math.random().toString(36).slice(2,6), x:24, y:24, text:c, color:'#2B2620', width:640}], paper:'blank', color:'#FFFFFF'}));
    await createNoteFromData({title:file.name.replace(/\.docx$/i,''), pages, currentPage:0, updatedAt:Date.now(), createdAt:Date.now()});
  }catch(err){ alert('Não foi possível importar este documento Word (só .docx é suportado).'); }
  hideLoading();
};

/* --- Exportar nota atual para PDF --- */
function loadImg(src){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=src; }); }
document.getElementById('exportPdfBtn').onclick=async()=>{
  const n=notes[currentId]; if(!n){ alert('Abre uma nota primeiro.'); return; }
  if(!window.jspdf){ alert('O exportador de PDF não carregou. Tenta novamente.'); return; }
  showLoading('A exportar PDF…');
  try{
    const { jsPDF }=window.jspdf;
    let doc=null;
    for(const p of n.pages){
      const w=p.bgW||900, h=p.bgH||1400;
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const ctx=c.getContext('2d');
      ctx.fillStyle=p.color||'#FFFFFF'; ctx.fillRect(0,0,w,h);
      if(p.bg){ const img=await loadImg(p.bg); ctx.drawImage(img,0,0,w,h); }
      (p.strokes||[]).forEach(s=>{
        const pts=s.pts.split(' ').filter(Boolean).map(pt=>pt.split(',').map(Number));
        if(pts.length<2) return;
        ctx.beginPath();
        pts.forEach(([x,y],idx)=> idx===0?ctx.moveTo(x,y):ctx.lineTo(x,y));
        ctx.strokeStyle=s.color; ctx.lineWidth=s.tool==='highlighter'?s.w*4:s.w;
        ctx.globalAlpha=s.tool==='highlighter'?0.35:1;
        ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke(); ctx.globalAlpha=1;
      });
      (p.texts||[]).forEach(t=>{
        ctx.fillStyle=t.color||'#2B2620'; ctx.font='20px Georgia, serif';
        (t.text||'').split('\n').forEach((line,li)=> ctx.fillText(line, t.x, t.y+22+li*26));
      });
      const imgData=c.toDataURL('image/jpeg',0.85);
      const orient=w>h?'l':'p';
      if(!doc) doc=new jsPDF({orientation:orient, unit:'px', format:[w,h]});
      else doc.addPage([w,h], orient);
      doc.addImage(imgData,'JPEG',0,0,w,h);
    }
    const blob=doc.output('blob');
    const filename=(n.title||'nota')+'.pdf';
    if(downloadsCap){ await downloadsCap.save({filename, data:blob}); }
    else{ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url); }
  }catch(err){ alert('Não foi possível exportar esta nota.'); }
  hideLoading();
};

function gapiLoaded(){
  gapi.load('client', async ()=>{
    try{
      await Promise.all([gapi.client.load(GCAL_DISCOVERY), gapi.client.load(DRIVE_DISCOVERY)]);
      gcal.gapiReady=true;
    }catch(e){ console.error('Erro API Google',e); }
  });
}

function gisLoaded(){
  gcal.tokenClient=google.accounts.oauth2.initTokenClient({
    client_id: GCAL_CLIENT_ID,
    scope:     GCAL_SCOPE,
    callback:  handleGCalToken
  });
  gcal.gisReady=true;
  if(localStorage.getItem('gcal_connected')) tryAutoConnect();
}

async function tryAutoConnect(){
  for(let i=0;i<80;i++){ if(gcal.gapiReady) break; await new Promise(r=>setTimeout(r,100)); }
  if(!gcal.gapiReady){ localStorage.removeItem('gcal_connected'); return; }
  gcal.loading=true; render();
  gcal.tokenClient.requestAccessToken({prompt:''});
}

function startAutoRefresh(){
  clearInterval(gcalRefreshTimer);
  gcalRefreshTimer=setInterval(()=>{ if(gcal.connected&&gcal.gisReady) gcal.tokenClient.requestAccessToken({prompt:''}); }, GCAL_REFRESH_MS);
}

async function handleGCalToken(resp){
  if(resp.error){
    if(resp.error==='interaction_required'||resp.error==='access_denied'){
      gcal.loading=false; render(); return;
    }
    showToast('Erro ao ligar: '+resp.error);
    gcal.loading=false; render(); return;
  }
  gcal.connected=true;
  localStorage.setItem('gcal_connected','1');
  startAutoRefresh();
  gcal.loading=true; render();
  await Promise.all([syncFromGCal(), loadFacNotesFromDrive()]);
  gcal.loading=false; render();
  showToast('Google ligado — Calendar e Drive sincronizados ✓');
}

function connectGCal(){
  if(!gcal.gapiReady||!gcal.gisReady){ showToast('A carregar API… aguarda um momento.'); return; }
  gcal.loading=true; render();
  gcal.tokenClient.requestAccessToken({prompt:''});
}

function disconnectGCal(){
  clearInterval(gcalRefreshTimer);
  localStorage.removeItem('gcal_connected');
  const token=gapi.client.getToken();
  if(token) google.accounts.oauth2.revoke(token.access_token,()=>{});
  gapi.client.setToken('');
  gcal.connected=false; driveState.fileId=null;
  render(); showToast('Google desligado');
}

async function syncFromGCal(){
  if(!gcal.connected) return;
  const now=new Date();
  const timeMin=new Date(now.getFullYear(),now.getMonth()-1,1).toISOString();
  const timeMax=new Date(now.getFullYear(),now.getMonth()+4,0).toISOString();
  try{
    const resp=await gapi.client.calendar.events.list({calendarId:'primary',timeMin,timeMax,singleEvents:true,orderBy:'startTime',maxResults:500});
    data.events=(resp.result.items||[]).filter(ev=>ev.status!=='cancelled').map(ev=>({
      id:ev.id, gcalId:ev.id, title:ev.summary||'(sem título)',
      date:(ev.start.date||(ev.start.dateTime||'').slice(0,10)),
      time:ev.start.dateTime?ev.start.dateTime.slice(11,16):'',
      location:ev.location||'', color:EV_COLORS[0]
    }));
    saveData();
  }catch(e){
    if(e.status===401){ gcal.connected=false; showToast('Sessão expirada — volta a ligar.'); }
  }
}

async function createGCalEvent(ev){
  if(!gcal.connected) return null;
  let startVal,endVal;
  if(ev.time){
    startVal={dateTime:`${ev.date}T${ev.time}:00`,timeZone:TZ};
    const[h,m]=ev.time.split(':').map(Number);
    endVal={dateTime:`${ev.date}T${String(Math.min(h+1,23)).padStart(2,'0')}:${String(m).padStart(2,'0')}:00`,timeZone:TZ};
  } else {
    const next=new Date(ev.date+'T12:00:00'); next.setDate(next.getDate()+1);
    startVal={date:ev.date}; endVal={date:isoFromDate(next)};
  }
  try{
    const resp=await gapi.client.calendar.events.insert({calendarId:'primary',resource:{summary:ev.title,location:ev.location||'',start:startVal,end:endVal}});
    return resp.result.id;
  }catch(e){ console.error('Erro ao criar evento:',e); return null; }
}

async function deleteGCalEvent(gcalId){
  if(!gcal.connected||!gcalId) return;
  try{ await gapi.client.calendar.events.delete({calendarId:'primary',eventId:gcalId}); }
  catch(e){ if(e.status!==410) console.error(e); }
}

/* ════════════════════════════════════════
   GOOGLE DRIVE — sync Faculdade notes
════════════════════════════════════════ */
async function getDriveFileId(){
  if(driveState.fileId) return driveState.fileId;
  try{
    const search=await gapi.client.drive.files.list({q:`name='${DRIVE_FILENAME}' and trashed=false`,fields:'files(id)',spaces:'drive'});
    if(search.result.files&&search.result.files.length>0){
      driveState.fileId=search.result.files[0].id;
    } else {
      // Criar ficheiro novo
      const meta=await gapi.client.drive.files.create({resource:{name:DRIVE_FILENAME,mimeType:'application/json'},fields:'id'});
      driveState.fileId=meta.result.id;
      // Upload conteúdo inicial
      await gapi.client.request({path:`https://www.googleapis.com/upload/drive/v3/files/${driveState.fileId}`,method:'PATCH',params:{uploadType:'media'},headers:{'Content-Type':'application/json'},body:'[]'});
    }
  }catch(e){ console.error('Drive getDriveFileId error:',e); return null; }
  return driveState.fileId;
}

async function saveFacNotesToDrive(){
  if(!gcal.connected) return;
  const fid=await getDriveFileId();
  if(!fid) return;
  try{
    await gapi.client.request({path:`https://www.googleapis.com/upload/drive/v3/files/${fid}`,method:'PATCH',params:{uploadType:'media'},headers:{'Content-Type':'application/json'},body:JSON.stringify(data.facNotes)});
    driveState.lastSync=new Date();
    updateDriveStatus();
  }catch(e){ console.error('Drive save error:',e); }
}

async function loadFacNotesFromDrive(){
  if(!gcal.connected) return;
  const fid=await getDriveFileId();
  if(!fid) return;
  try{
    const resp=await gapi.client.request({path:`https://www.googleapis.com/drive/v3/files/${fid}`,params:{alt:'media'}});
    const notes=JSON.parse(resp.body||'[]');
    if(Array.isArray(notes)&&notes.length>0){
      data.facNotes=notes;
      saveData();
    }
    driveState.lastSync=new Date();
    updateDriveStatus();
  }catch(e){ console.error('Drive load error:',e); }
}

function updateDriveStatus(){
  const el=document.getElementById('facDriveStatus');
  if(!el) return;
  if(!gcal.connected){ el.innerHTML=''; return; }
  const t=driveState.lastSync?driveState.lastSync.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}):'—';
  el.innerHTML=`<span style="color:var(--success)">● Drive</span> · sincronizado às ${t}`;
}

function buildNav(){
  const nav=document.getElementById('nav');

  NAV_ITEMS.forEach(item=>{
    const btn=document.createElement('button');
    btn.className=currentTab===item.id?'active':'';
    btn.innerHTML=`<span class="nav-emoji">${item.emoji}</span>${item.label}`;

}
function renderWeekBars(){
  const el=document.getElementById('weekBars');
  const since=Date.now()-7*24*60*60*1000;
  const totals={};CATEGORIES.forEach(c=>totals[c.id]=0);
  data.sessions.forEach(s=>{ if(new Date(s.date).getTime()>=since&&totals.hasOwnProperty(s.category)) totals[s.category]+=s.minutes; });
  const max=Math.max(1,...Object.values(totals));
  el.innerHTML=CATEGORIES.map(c=>{const mins=totals[c.id],pct=Math.round((mins/max)*100);return`<div class="bar-row"><div class="bar-label">${c.emoji} ${c.label}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${c.color}"></div></div><div class="bar-val">${(mins/60).toFixed(1)}h</div></div>`;}).join('');
}

/* ════════════════════════════════════════
   TODAY
════════════════════════════════════════ */
function renderTodayPage(){
  const today=todayISO();
  const list=data.tasks.filter(t=>!t.done&&(!t.due||t.due<=today)).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
  const done=data.tasks.filter(t=>t.done).length;
  const todaySessions=data.sessions.filter(s=>s.date===today);
  const todayMins=todaySessions.reduce((s,e)=>s+e.minutes,0);
  const todayEvs=data.events.filter(e=>e.date===today).sort((a,b)=>(a.time||'').localeCompare(b.time||''));

  // Context Hero Logic
  const now = new Date();
  const currentMins = now.getHours() * 60 + now.getMinutes();
  let activeEv = null, nextEv = null, ctxType = 'none';

  for(const ev of todayEvs){
    if(!ev.time) continue;
    const [h,m] = ev.time.split(':').map(Number);
    const evMins = h*60 + m;
    // Considera ativo 15 min antes e dura 2h (assumindo aulas de bloco 2h padrão)
    if(currentMins >= evMins - 15 && currentMins <= evMins + 120){ activeEv=ev; ctxType='active'; break; }
    else if(evMins > currentMins && !nextEv){ nextEv=ev; ctxType='next'; }
  }

  const targetEv = activeEv || nextEv;
  let heroHTML = '';

  if(targetEv){
    const badge = ctxType === 'active' 
      ? `<div class="ch-badge"><div class="ch-badge-dot"></div> A decorrer agora</div>` 
      : `<div class="ch-badge">A seguir às ${targetEv.time}</div>`;
    heroHTML = `<div class="context-hero">
      ${badge}
      <h2 class="ch-title">${escapeHTML(targetEv.title)}</h2>
      <div class="ch-actions">
        <button class="btn-hero" data-action="context-note" data-title="${escapeHTML(targetEv.title)}">📝 Começar Apontamentos</button>
        <button class="btn btn-ghost" style="background:var(--surface);border:1px solid var(--border)" data-action="timer-custom" data-title="${escapeHTML(targetEv.title)}">⏱️ Iniciar Foco</button>
      </div>
    </div>`;
  } else {
    heroHTML = `<div class="context-hero empty-hero">
      <div class="ch-badge" style="color:var(--ink-sub)">${todayEvs.length ? 'Neste momento' : 'O teu dia'}</div>
      <h2 class="ch-title" style="color:var(--ink-ghost);font-size:28px;margin-bottom:0;">${todayEvs.length ? 'Nenhum evento a decorrer.' : 'Não tens eventos agendados hoje.'}</h2>
    </div>`;
  }

  const strip=`<div class="today-strip">
    <div class="strip-card"><div class="sc-label">Pendentes</div><div class="sc-value">${list.length}</div><div class="sc-sub">tarefas para hoje</div></div>
    <div class="strip-card"><div class="sc-label">Concluídas</div><div class="sc-value">${done}</div><div class="sc-sub">de ${data.tasks.length} total</div></div>
    <div class="strip-card"><div class="sc-label">Tempo hoje</div><div class="sc-value">${todayMins}m</div><div class="sc-sub">${todaySessions.length} sessão(ões)</div></div>
  </div>`;
  
  const evSection=todayEvs.length?`<div class="card" style="margin-bottom:0;"><div class="card-title">📅 Horário</div><div class="ev-list">${todayEvs.map(evRowHTML).join('')}</div></div>`:'';
  const rows=list.length?list.map(taskRowHTML).join(''):`<div class="empty"><span class="empty-icon">✦</span>Nenhuma tarefa pendente!</div>`;
  return `
    <div class="page-header">
      ${weatherData ? `<div class="weather-widget">🌤️ ${weatherData.temperature}ºC — O teu dia, otimizado.</div>` : ''}<div class="page-eyebrow">${now.toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'})}</div>
      <h1 class="page-title" style="font-size:42px;"><em>${greet()}</em></h1>
      <p class="page-sub">O teu painel de controlo.</p>
    </div>
    ${strip}
    <div class="dashboard-grid">
      <div class="dash-col-left">
        ${heroHTML}
        ${evSection}
      </div>
      <div class="dash-col-right">

    <div class="card" style="margin-bottom:24px;">
      <div class="card-title">🌱 Hábitos Diários</div>
      <div class="habit-list">
        ${data.habits.map(h => {
           const isDone = h.history.includes(today);
           return `<div class="habit-row" onclick="toggleHabit('${h.id}')" style="cursor:pointer;">
             <div class="habit-info">
               <div class="habit-checkbox ${isDone ? 'done' : ''}">${isDone ? '✓' : ''}</div>
               ${h.name}
             </div>
             ${h.streak > 0 ? `<div class="habit-streak">🔥 ${h.streak}</div>` : ''}
           </div>`;
        }).join('')}
      </div>
    </div>
    
        <div class="card" style="margin-bottom:0;"><div class="card-title">Tarefas pendentes</div><div class="task-list">${rows}</div></div>
      </div>
    </div>
  `;
}

function renderAgendaPage(){
  const year=calDate.getFullYear(),month=calDate.getMonth();
  const monthLabel=calDate.toLocaleDateString('pt-PT',{month:'long',year:'numeric'});
  const firstDay=new Date(year,month,1),lastDay=new Date(year,month+1,0);
  let startDow=firstDay.getDay(); startDow=startDow===0?6:startDow-1;
  const today=todayISO();
  const cells=[];
  for(let i=0;i<startDow;i++){const d=new Date(year,month,1-startDow+i);cells.push({date:isoFromDate(d),other:true});}
  for(let d=1;d<=lastDay.getDate();d++) cells.push({date:`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,other:false});
  while(cells.length%7!==0){const d=new Date(year,month+1,cells.length-lastDay.getDate()-startDow+1);cells.push({date:isoFromDate(d),other:true});}
  const wdHTML=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(w=>`<div class="cal-weekday">${w}</div>`).join('');
  const cellsHTML=cells.map(cell=>{
    const evs=data.events.filter(e=>e.date===cell.date);
    const dayNum=parseInt(cell.date.split('-')[2]);
    const isTd=cell.date===today,isSel=cell.date===selectedDay;
    const cls=['cal-day',cell.other?'other-month':'',isTd?'today':'',isSel?'selected':''].filter(Boolean).join(' ');
    const numEl=isTd?`<div class="cal-day-num"><div style="background:var(--accent);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600">${dayNum}</div></div>`:`<div class="cal-day-num">${dayNum}</div>`;

  const selEvs=(selectedDay?data.events.filter(e=>e.date===selectedDay):[]).sort((a,b)=>(a.time||'').localeCompare(b.time||''));

  const colorOpts=EV_COLORS.map((c,i)=>`<option value="${c}">${['Violeta','Verde','Âmbar','Rosa','Azul'][i]}</option>`).join('');
  return `<div class="page-header"><div class="page-eyebrow">Planeamento</div><h1 class="page-title">Agenda</h1><p class="page-sub">O teu calendário${gcal.connected?' · sincronizado com Google Calendar':''}.</p></div>

  <div class="cal-nav"><div class="cal-month-label">${monthLabel.charAt(0).toUpperCase()+monthLabel.slice(1)}</div><div class="cal-nav-btns"><button class="cal-nav-btn" id="calPrev">← Anterior</button><button class="cal-nav-btn" id="calToday">Hoje</button><button class="cal-nav-btn" id="calNext">Próximo →</button>${gcalControls}</div></div>
  <div class="cal-grid">${wdHTML}${cellsHTML}</div>
  <div class="day-panel"><div class="day-panel-header"><div class="day-panel-title">${selLabel}</div></div><div class="ev-list">${selEvs.length?selEvs.map(evRowHTML).join(''):`<div class="empty" style="border:none;padding:14px 0;font-size:13px">Sem eventos neste dia.</div>`}</div></div>
  <div class="card"><div class="card-title">Novo evento${gcal.connected?' — adicionado ao Google Calendar':''}</div>
  <form id="evForm" class="form-grid">
    <div class="field full-span"><label>Título</label><input type="text" id="ev-title" placeholder="Ex: Reunião de grupo" required></div>
    <div class="field"><label>Data</label><input type="date" id="ev-date" value="${selectedDay||today}"></div>
    <div class="field"><label>Hora (opcional)</label><input type="time" id="ev-time"></div>
    <div class="field"><label>Local</label><input type="text" id="ev-loc" placeholder="Ex: Sala B, online…"></div>
    <div class="field"><label>Cor</label><select id="ev-color">${colorOpts}</select></div>
    <div class="form-actions"><button type="submit" class="btn btn-primary" id="evSubmitBtn">${gcal.connected?'📅 Criar no Google Calendar':'Adicionar evento'}</button></div>
  </form></div>`;
}
function evRowHTML(e){return`<div class="ev-row" style="--ev-color:${e.color||EV_COLORS[0]}"><div class="ev-time">${e.time||'——'}</div><div class="ev-body"><div class="ev-title">${escapeHTML(e.title)}</div>${e.location?`<div class="ev-loc">📍 ${escapeHTML(e.location)}</div>`:''}</div><button class="icon-btn danger" data-action="delete-event" data-id="${e.id}">✕</button></div>`;}

function renderNotasPage(){

  let notes=[...data.notes];
  if(q) notes=notes.filter(n=>(n.title+n.body).toLowerCase().includes(q));

  const cards=notes.map(n=>`<div class="note-card ${n.color||'nc-default'} ${n.pinned?'pinned':''}" data-action="open-note" data-id="${n.id}">${n.title?`<div class="note-card-title">${escapeHTML(n.title)}</div>`:''}<div class="note-card-body">${escapeHTML(n.body||'')}</div><div class="note-card-date">${new Date(n.createdAt).toLocaleDateString('pt-PT',{day:'numeric',month:'short'})}</div></div>`).join('');

  const rows=data.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30);
  return `
    <div class="page-header"><div class="page-eyebrow">Gestão financeira</div><h1 class="page-title">Dinheiro</h1><p class="page-sub">Registo de rendimentos e gastos.</p></div>

      <div class="money-card"><div class="label">Rendimentos</div><div class="value positive">€${totalIncome.toFixed(2)}</div></div>
      <div class="money-card"><div class="label">Gastos</div><div class="value negative">€${total.toFixed(2)}</div></div>
      <div class="money-card"><div class="label">Balanço Atual</div><div class="value ${balance<0?'negative':'positive'}">€${balance.toFixed(2)}</div></div>
    </div>
    
    <div class="dashboard-grid">
      <div class="dash-col-left">
        <div class="card">
          <div class="card-title">📊 Análise de Gastos</div>
          ${total>0 ? `<div class="chart-container"><canvas id="moneyChart"></canvas></div>` : `<div class="empty">Sem gastos para analisar.</div>`}
          ${CATEGORIES.map(c=>{const v=byCat[c.id],p=Math.round((v/maxv)*100);return`<div class="bar-row" style="margin-bottom:10px"><div class="bar-label">${c.emoji} ${c.label}</div><div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${c.color}"></div></div><div class="bar-val">€${v.toFixed(0)}</div></div>`;}).join('')}
        </div>
      </div>
      
      <div class="dash-col-right">
        <div class="card"><div class="card-title">Novo Movimento</div>
          <div style="display:flex;gap:12px;margin-bottom:12px;">
            <button class="btn btn-primary" style="flex:1;" onclick="document.getElementById('expenseForm').style.display='block';document.getElementById('incomeForm').style.display='none';">Novo Gasto</button>
            <button class="btn btn-ghost" style="flex:1;background:var(--surface2);" onclick="document.getElementById('incomeForm').style.display='block';document.getElementById('expenseForm').style.display='none';">Novo Rendimento</button>
          </div>
          
          <form id="expenseForm" class="form-grid">
            <div class="field full-span"><label>Descrição do Gasto</label><input type="text" id="e-desc" required></div>
            <div class="field"><label>Valor (€)</label><input type="number" id="e-amount" min="0" step="0.01" required></div>
            <div class="field"><label>Categoria</label><select id="e-category">${CATEGORIES.map(c=>`<option value="${c.id}">${c.emoji} ${c.label}</option>`).join('')}</select></div>
            <div class="form-actions"><button type="submit" class="btn btn-primary">Adicionar Gasto</button></div>
          </form>

          <form id="incomeForm" class="form-grid" style="display:none;">
            <div class="field full-span"><label>Origem do Rendimento</label><input type="text" id="i-desc" placeholder="Ex: Mesada, Salário" required></div>
            <div class="field"><label>Valor (€)</label><input type="number" id="i-amount" min="0" step="0.01" required></div>
            <div class="form-actions"><button type="submit" class="btn btn-primary" style="background:var(--success);">Adicionar Rendimento</button></div>
          </form>
        </div>
        
        <div class="card"><div class="card-title">Últimos Movimentos</div>
          <div class="expense-list">
            ${(data.incomes||[]).map(i=>`<div class="expense-row"><div class="expense-date">${formatDate(i.date)}</div><div class="expense-desc">${escapeHTML(i.desc)}<span class="tag cat-casa" style="color:var(--success)">+ Rendimento</span></div><div class="expense-amount" style="color:var(--success)">+€${i.amount.toFixed(2)}</div></div>`).join('')}
            ${rows.map(e=>`<div class="expense-row"><div class="expense-date">${formatDate(e.date)}</div><div class="expense-desc">${escapeHTML(e.desc)}<span class="tag cat-${e.category}">${catInfo(e.category).emoji} ${catInfo(e.category).label}</span></div><div class="expense-amount">-€${e.amount.toFixed(2)}</div><button class="icon-btn danger" data-action="delete-expense" data-id="${e.id}">✕</button></div>`).join('')}
            ${(rows.length===0 && (!data.incomes||data.incomes.length===0)) ? `<div class="empty">Ainda sem movimentos.</div>` : ''}
