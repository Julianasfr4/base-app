/* ════════════════════════════════════════
   HANDLERS
════════════════════════════════════════ */
function attachHandlers(){
  document.querySelectorAll('[data-action="toggle"]').forEach(b=>b.onclick=()=>toggleTask(b.dataset.id));
  document.querySelectorAll('[data-action="delete"]').forEach(b=>b.onclick=()=>deleteTask(b.dataset.id));
  document.querySelectorAll('[data-action="timer"]').forEach(b=>b.onclick=()=>openTimer(b.dataset.id));
  document.querySelectorAll('[data-action="promote"]').forEach(b=>b.onclick=()=>promoteIdea(b.dataset.id));
  document.querySelectorAll('[data-action="delete-idea"]').forEach(b=>b.onclick=()=>deleteIdea(b.dataset.id));
  document.querySelectorAll('[data-action="delete-expense"]').forEach(b=>b.onclick=()=>deleteExpense(b.dataset.id));
  document.querySelectorAll('[data-action="delete-event"]').forEach(b=>b.onclick=()=>deleteEvent(b.dataset.id));
  document.querySelectorAll('[data-action="open-note"]').forEach(b=>b.onclick=()=>openNote(b.dataset.id));
  document.querySelectorAll('[data-action="open-fac-note"]').forEach(b=>b.onclick=()=>openFacNote(b.dataset.id));
  
  // Context Hero actions
  document.querySelectorAll('[data-action="context-note"]').forEach(b=>b.onclick=()=>{
    currentTab='faculdade'; render(); openFacNote(null);
    document.getElementById('facTitle').value=`Apontamentos: ${b.dataset.title}`;
    document.getElementById('facCategory').value='apontamentos';
  });
  document.querySelectorAll('[data-action="timer-custom"]').forEach(b=>b.onclick=()=>openTimer(null, b.dataset.title));

  // task form
  const tf=document.getElementById('taskForm');
  if(tf) tf.onsubmit=e=>{e.preventDefault();const t={id:uid(),title:document.getElementById('f-title').value.trim(),category:currentTab,est:parseInt(document.getElementById('f-est').value)||0,actual:0,due:document.getElementById('f-due').value||null,priority:document.getElementById('f-priority').value,urgency:document.getElementById('f-urgency').value,energy:document.getElementById('f-energy').value,recurring:document.getElementById('f-recurring').value,done:false};if(!t.title)return;data.tasks.push(t);saveData();render();};

  // expense form
  const ef=document.getElementById('expenseForm');
  if(ef) ef.onsubmit=e=>{e.preventDefault();const ex={id:uid(),desc:document.getElementById('e-desc').value.trim(),amount:parseFloat(document.getElementById('e-amount').value)||0,category:document.getElementById('e-category').value,date:document.getElementById('e-date').value||todayISO()};if(!ex.desc)return;data.expenses.push(ex);saveData();render();};

  const gi=document.getElementById('goalInput');
  if(gi) gi.onchange=()=>{data.goal=parseFloat(gi.value)||0;saveData();render();};


  // Render Chart if on money page
  if(currentTab==='dinheiro' && document.getElementById('moneyChart')){
    const ctx = document.getElementById('moneyChart').getContext('2d');
    if(chartInstance) chartInstance.destroy();
    
    const catLabels = CATEGORIES.map(c=>c.emoji + ' ' + c.label);
    const catData = CATEGORIES.map(c=> {
      return data.expenses.filter(e=>e.category===c.id).reduce((s,e)=>s+e.amount,0);
    });
    const catColors = CATEGORIES.map(c=>c.color);
    
    chartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: catLabels,
        datasets: [{ data: catData, backgroundColor: catColors, borderWidth: 0 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right', labels: { color: '#eeedf0', font: { family: "'Plus Jakarta Sans', sans-serif" } } }
        }
      }
    });
  }

  // Income form
  const incForm = document.getElementById('incomeForm');
  if(incForm) incForm.onsubmit=e=>{
    e.preventDefault();
    if(!data.incomes) data.incomes = [];
    data.incomes.push({
      id: uid(),
      desc: document.getElementById('i-desc').value.trim(),
      amount: parseFloat(document.getElementById('i-amount').value)||0,
      date: todayISO()
    });
    saveData(); render();
  };

  // calendar
  const calPrev=document.getElementById('calPrev');if(calPrev) calPrev.onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);render();};
  const calNext=document.getElementById('calNext');if(calNext) calNext.onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);render();};
  const calToday=document.getElementById('calToday');if(calToday) calToday.onclick=()=>{calDate=new Date();selectedDay=todayISO();render();};
  document.querySelectorAll('.cal-day').forEach(el=>{el.onclick=()=>{selectedDay=el.dataset.day;render();};});

  // event form
  const evForm=document.getElementById('evForm');
  if(evForm) evForm.onsubmit=async e=>{
    e.preventDefault();
    const ev={id:uid(),title:document.getElementById('ev-title').value.trim(),date:document.getElementById('ev-date').value||todayISO(),time:document.getElementById('ev-time').value||'',location:document.getElementById('ev-loc').value.trim(),color:document.getElementById('ev-color').value,gcalId:null};
    if(!ev.title)return;
    const btn=document.getElementById('evSubmitBtn');if(btn){btn.disabled=true;btn.textContent='A criar…';}
    if(gcal.connected){const gcalId=await createGCalEvent(ev);if(gcalId){ev.id=gcalId;ev.gcalId=gcalId;showToast('Evento criado no Google Calendar ✓');}}
    data.events.push(ev);selectedDay=ev.date;const[y,m]=ev.date.split('-');calDate=new Date(parseInt(y),parseInt(m)-1,1);saveData();render();
  };

  // gcal
  const gcalConnectBtn=document.getElementById('gcalConnectBtn');if(gcalConnectBtn) gcalConnectBtn.onclick=connectGCal;
  const gcalSyncBtn=document.getElementById('gcalSyncBtn');if(gcalSyncBtn) gcalSyncBtn.onclick=async()=>{gcal.loading=true;render();await Promise.all([syncFromGCal(),loadFacNotesFromDrive()]);gcal.loading=false;render();showToast('Sincronizado ✓');};
  const gcalDisconnectBtn=document.getElementById('gcalDisconnectBtn');if(gcalDisconnectBtn) gcalDisconnectBtn.onclick=disconnectGCal;

  // drive buttons in fac tab
  const driveConnectBtn=document.getElementById('driveConnectBtn');if(driveConnectBtn) driveConnectBtn.onclick=connectGCal;
  const driveResyncBtn=document.getElementById('driveResyncBtn');if(driveResyncBtn) driveResyncBtn.onclick=async()=>{driveState.syncing=true;await loadFacNotesFromDrive();driveState.syncing=false;render();showToast('Notas sincronizadas com Drive ✓');};

  // fac category chips
  document.querySelectorAll('[data-faccat]').forEach(b=>{b.onclick=()=>{facCatFilter=b.dataset.faccat;render();};});

  // fac search
  const facSearch=document.getElementById('facSearchInput');if(facSearch) facSearch.oninput=()=>{facSearchQ=facSearch.value;render();};

  // new fac note buttons
  const nfn=document.getElementById('newNoteBtn');if(nfn) nfn.onclick=()=>openFacNote(null);
  const nfn2=document.getElementById('newNoteBtn2');if(nfn2) nfn2.onclick=()=>openFacNote(null);

  // general notes
  const newNoteBtn=document.getElementById('newNoteBtn');if(newNoteBtn) newNoteBtn.onclick=()=>openNote(null);
  const newNoteBtn2=document.getElementById('newNoteBtn2');if(newNoteBtn2) newNoteBtn2.onclick=()=>openNote(null);
}

/* ════════════════════════════════════════
   TASK / IDEA / EXPENSE / EVENT ACTIONS
════════════════════════════════════════ */
function toggleTask(id){const t=data.tasks.find(t=>t.id===id);if(t){t.done=!t.done;saveData();render();}}
function deleteTask(id){if(!confirm('Remover esta tarefa?'))return;data.tasks=data.tasks.filter(t=>t.id!==id);saveData();render();}
function deleteIdea(id){data.ideas=data.ideas.filter(i=>i.id!==id);saveData();render();}
function deleteExpense(id){if(!confirm('Remover este gasto?'))return;data.expenses=data.expenses.filter(e=>e.id!==id);saveData();render();}
async function deleteEvent(id){if(!confirm('Remover este evento?'))return;const ev=data.events.find(e=>e.id===id);if(ev&&ev.gcalId&&gcal.connected){await deleteGCalEvent(ev.gcalId);showToast('Evento removido do Google Calendar ✓');}data.events=data.events.filter(e=>e.id!==id);saveData();render();}
function promoteIdea(id){const idea=data.ideas.find(i=>i.id===id);if(!idea)return;const sel=document.querySelector(`.promo-cat[data-id="${id}"]`);data.tasks.push({id:uid(),title:idea.text,category:sel?sel.value:'casa',est:30,actual:0,due:null,priority:'baixa',urgency:'baixa',energy:'leve',recurring:'nenhuma',done:false});data.ideas=data.ideas.filter(i=>i.id!==id);saveData();render();}

/* ════════════════════════════════════════
   CAPTURE
════════════════════════════════════════ */
document.getElementById('captureBtn').onclick=captureIdea;
document.getElementById('captureInput').addEventListener('keydown',e=>{if(e.key==='Enter')captureIdea();});
function captureIdea(){const input=document.getElementById('captureInput');const text=input.value.trim();if(!text)return;data.ideas.push({id:uid(),text,createdAt:Date.now()});input.value='';saveData();if(currentTab==='ideias')render();else showToast('Ideia guardada! 💡');}

/* ════════════════════════════════════════
   GENERAL NOTE MODAL
════════════════════════════════════════ */
function buildColorPicker(){
  const cp=document.getElementById('colorPicker');
  cp.innerHTML=NOTE_COLORS.map(nc=>`<div class="color-dot ${noteState.color===nc.cls?'sel':''}" style="background:${nc.dot}" data-cls="${nc.cls}"></div>`).join('');
  cp.querySelectorAll('.color-dot').forEach(d=>{d.onclick=()=>{noteState.color=d.dataset.cls;document.querySelectorAll('.color-dot').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');};});
}
function openNote(id){
  const note=id?data.notes.find(n=>n.id===id):null;
  noteState={id:note?note.id:null,color:note?note.color:'nc-default',pinned:note?!!note.pinned:false};
  document.getElementById('noteTitleInput').value=note?note.title:'';
  document.getElementById('noteBodyInput').value=note?note.body:'';
  document.getElementById('notePinBtn').textContent=noteState.pinned?'📌 Fixado':'📌 Fixar';
  document.getElementById('noteDeleteBtn').style.display=id?'':'none';
  buildColorPicker();
  document.getElementById('noteOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('noteBodyInput').focus(),100);
}
function closeNote(){document.getElementById('noteOverlay').classList.remove('open');}
document.getElementById('noteSaveBtn').onclick=()=>{
  const title=document.getElementById('noteTitleInput').value.trim(),body=document.getElementById('noteBodyInput').value.trim();
  if(!title&&!body){closeNote();return;}
  if(noteState.id){const n=data.notes.find(n=>n.id===noteState.id);if(n){n.title=title;n.body=body;n.color=noteState.color;n.pinned=noteState.pinned;n.updatedAt=Date.now();}}
  else data.notes.push({id:uid(),title,body,color:noteState.color,pinned:noteState.pinned,createdAt:Date.now()});
  saveData();closeNote();render();
};
document.getElementById('notePinBtn').onclick=()=>{noteState.pinned=!noteState.pinned;document.getElementById('notePinBtn').textContent=noteState.pinned?'📌 Fixado':'📌 Fixar';};
document.getElementById('noteDeleteBtn').onclick=()=>{if(!noteState.id||!confirm('Apagar esta nota?'))return;data.notes=data.notes.filter(n=>n.id!==noteState.id);saveData();closeNote();render();};
document.getElementById('noteOverlay').onclick=e=>{if(e.target===e.currentTarget)closeNote();};

/* ════════════════════════════════════════
   FAC NOTE MODAL (Samsung Notes)
════════════════════════════════════════ */
function buildFacColorPicker(){
  const cp=document.getElementById('facColorPicker');
  cp.innerHTML=FAC_COLORS.map(fc=>`<div class="fac-cdot ${facNoteState.color===fc.cls?'sel':''}" style="background:${fc.dot}" data-cls="${fc.cls}" title="${fc.label}"></div>`).join('');
  cp.querySelectorAll('.fac-cdot').forEach(d=>{
    d.onclick=()=>{
      facNoteState.color=d.dataset.cls;
      document.querySelectorAll('.fac-cdot').forEach(x=>x.classList.remove('sel'));

function openFacNote(id){
  const note=id?data.facNotes.find(n=>n.id===id):null;
  facNoteState={id:note?note.id:null, color:note?note.color:'nc-default', pinned:note?!!note.pinned:false};
  document.getElementById('facTitle').value=note?note.title:'';
  document.getElementById('facEditor').innerHTML=note?note.content:'';
  document.getElementById('facCategory').value=note?note.category:'apontamentos';
  document.getElementById('facPinBtn').classList.toggle('active', facNoteState.pinned);
  document.getElementById('facDeleteBtn').style.display=id?'':'none';
  buildFacColorPicker();
  updateFacWordCount();
  document.getElementById('facOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('facEditor').focus(),150);
}

function closeFacNote(){document.getElementById('facOverlay').classList.remove('open');}

async function saveFacNote(){
  const title=document.getElementById('facTitle').value.trim();
  const content=document.getElementById('facEditor').innerHTML.trim();
  if(!title&&(!content||content==='<br>')) { closeFacNote(); return; }
  if(facNoteState.id){
    const n=data.facNotes.find(n=>n.id===facNoteState.id);
    if(n){n.title=title;n.content=content;n.category=document.getElementById('facCategory').value;n.color=facNoteState.color;n.pinned=facNoteState.pinned;n.updatedAt=Date.now();}
  } else {
    data.facNotes.push({id:uid(),title,content,category:document.getElementById('facCategory').value,color:facNoteState.color,pinned:facNoteState.pinned,createdAt:Date.now()});
  }
  saveData();
  closeFacNote();
  render();
  // Sync to Drive in background
  if(gcal.connected){
    await saveFacNotesToDrive();
    showToast('Nota guardada e sincronizada com Drive ✓');
  }
}

function updateFacWordCount(){
  const el=document.getElementById('facWordCount');
  if(!el) return;
  const text=stripHTML(document.getElementById('facEditor')?.innerHTML||'');
  const words=text.trim().split(/\s+/).filter(w=>w.length>0).length;
  el.textContent=words>0?`${words} palavra${words!==1?'s':''}` : '';
}

// Audio Recording
let mediaRec, audioChunks=[];
const facMicBtnEl = document.getElementById('facMicBtn');
if(facMicBtnEl){
  facMicBtnEl.onclick = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('facMicBtn');
    if(mediaRec && mediaRec.state === 'recording'){
       mediaRec.stop();
       if(btn){ btn.style.color = ''; btn.textContent = '🎙️ Gravar'; }
    } else {
       try {
         const stream = await navigator.mediaDevices.getUserMedia({audio:true});
         mediaRec = new MediaRecorder(stream);
         mediaRec.start();
         if(btn){ btn.style.color = 'var(--danger)'; btn.textContent = '⏹️ Parar (A Gravar...)'; }
         audioChunks = [];
         mediaRec.ondataavailable = ev => audioChunks.push(ev.data);
         mediaRec.onstop = () => {
            const audioBlob = new Blob(audioChunks, {type:'audio/webm'});
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
               const ed = document.getElementById('facEditor');
               if(ed){
                 ed.focus();
                 const audioHTML = `<br><audio controls src="${reader.result}"></audio><br>`;
                 document.execCommand('insertHTML', false, audioHTML);
               }
            };
            stream.getTracks().forEach(t=>t.stop());
         };
       } catch(err) {
         alert("Erro ao aceder ao microfone. Aceita as permissões do browser.");
       }
    }
  };
}

// Drawing Mode
let isDraw=false, dCtx=null, dCanvas=null, isEraser=false;
const facDrawBtnEl = document.getElementById('facDrawBtn');
if(facDrawBtnEl){
  facDrawBtnEl.onclick = (e) => {
    e.preventDefault();
    const ov = document.getElementById('drawOverlay');
    if(ov) ov.classList.add('open');
    dCanvas = document.getElementById('drawCanvas');
    const cont = document.getElementById('drawContainer');
    if(dCanvas && cont){
      dCanvas.width = cont.clientWidth;
      dCanvas.height = cont.clientHeight;
      dCtx = dCanvas.getContext('2d');
      dCtx.lineCap = 'round';
      dCtx.lineJoin = 'round';
      updateDrawStyle();
    }
  };
}

function updateDrawStyle(){
  if(!dCtx) return;
  const colEl = document.getElementById('drawColor');
  const sizeEl = document.getElementById('drawSize');
  if(isEraser){
    dCtx.globalCompositeOperation='destination-out';
    dCtx.lineWidth=30;
  } else {
    dCtx.globalCompositeOperation='source-over';
    dCtx.strokeStyle=colEl?colEl.value:'#7c6af7';
    dCtx.lineWidth=sizeEl?sizeEl.value:3;
  }
}

const drawColorEl = document.getElementById('drawColor');
if(drawColorEl) drawColorEl.onchange = () => { isEraser=false; updateDrawStyle(); };
const drawSizeEl = document.getElementById('drawSize');
if(drawSizeEl) drawSizeEl.onchange = () => { updateDrawStyle(); };
const drawEraserEl = document.getElementById('drawEraser');
if(drawEraserEl) drawEraserEl.onclick = () => { isEraser=true; updateDrawStyle(); };

function closeDrawMode(save){
  const ov = document.getElementById('drawOverlay');
  if(ov) ov.classList.remove('open');
  if(save && dCanvas){
     const dataUrl = dCanvas.toDataURL('image/png');

// Draw events
const getX = (e) => e.offsetX || (e.touches ? e.touches[0].clientX : 0);
const getY = (e) => e.offsetY || (e.touches ? e.touches[0].clientY - 60 : 0);

const startDraw = (e) => { if(!dCtx) return; isDraw=true; dCtx.beginPath(); dCtx.moveTo(getX(e), getY(e)); };
const draw = (e) => { if(!isDraw || !dCtx) return; e.preventDefault(); dCtx.lineTo(getX(e), getY(e)); dCtx.stroke(); };
const endDraw = () => { isDraw=false; };

function initDrawCanvasListeners(){
  const cvs = document.getElementById('drawCanvas');
  if(cvs) {
    cvs.addEventListener('mousedown', startDraw);
    cvs.addEventListener('mousemove', draw);
    cvs.addEventListener('mouseup', endDraw);
    cvs.addEventListener('touchstart', startDraw, {passive:false});
    cvs.addEventListener('touchmove', draw, {passive:false});
    cvs.addEventListener('touchend', endDraw);
  }
}
window.addEventListener('DOMContentLoaded', () => initDrawCanvasListeners());

function openTimer(taskId, customTitle=null){
  const t=data.tasks.find(t=>t.id===taskId);
  Object.assign(timerState,{taskId,totalSeconds:25*60,remaining:25*60,running:false,customTitle});
  clearInterval(timerState.interval);
  document.getElementById('timerTaskName').textContent=customTitle ? customTitle : (t?t.title:'Foco livre');
  document.getElementById('timerStartPause').textContent='Iniciar';
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.toggle('active',b.dataset.mins==='25'));
  updateRing(); document.getElementById('timerOverlay').classList.add('open');
}
function closeTimer(){clearInterval(timerState.interval);timerState.running=false;document.getElementById('timerOverlay').classList.remove('open');}
function updateRing(){const circ=2*Math.PI*85,fg=document.getElementById('ringFg');fg.style.strokeDasharray=circ;fg.style.strokeDashoffset=circ*(1-timerState.remaining/timerState.totalSeconds);const m=Math.floor(timerState.remaining/60).toString().padStart(2,'0'),s=(timerState.remaining%60).toString().padStart(2,'0');document.getElementById('timerDigits').textContent=`${m}:${s}`;}
function tick(){if(timerState.remaining>0){timerState.remaining--;updateRing();}else finishSession(true);}
function finishSession(auto){
  clearInterval(timerState.interval);timerState.running=false;
  const minutes=Math.round((timerState.totalSeconds-timerState.remaining)/60);
  const t=data.tasks.find(t=>t.id===timerState.taskId);
  if(t&&minutes>0){
    t.actual=(t.actual||0)+minutes;
    data.sessions.push({id:uid(),taskId:t.id,category:t.category,minutes,date:todayISO()});
    saveData();
  } else if(!t && minutes>0){
    // Grava como tempo de faculdade por defeito quando vem do Hero Context
    data.sessions.push({id:uid(),taskId:null,category:'faculdade',minutes,date:todayISO()});
    saveData();
  }
  document.getElementById('timerStartPause').textContent='Iniciar';
  if(auto){document.getElementById('timerDigits').textContent='✦';showToast(`Sessão concluída! +${minutes}min ✦`);}
  render();
}
document.getElementById('timerStartPause').onclick=()=>{if(timerState.running){clearInterval(timerState.interval);timerState.running=false;document.getElementById('timerStartPause').textContent='Continuar';}else{timerState.running=true;timerState.interval=setInterval(tick,1000);document.getElementById('timerStartPause').textContent='Pausar';}};
document.getElementById('timerReset').onclick=()=>{clearInterval(timerState.interval);timerState.running=false;timerState.remaining=timerState.totalSeconds;document.getElementById('timerStartPause').textContent='Iniciar';updateRing();};
document.getElementById('timerFinish').onclick=()=>finishSession(false);
document.getElementById('timerCloseBtn').onclick=closeTimer;
document.querySelectorAll('.preset-btn').forEach(btn=>{btn.onclick=()=>{if(timerState.running)return;const mins=parseInt(btn.dataset.mins);timerState.totalSeconds=mins*60;timerState.remaining=mins*60;document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('timerStartPause').textContent='Iniciar';updateRing();};});
document.getElementById('timerOverlay').onclick=e=>{if(e.target===e.currentTarget)closeTimer();};

function showToast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText=`position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border2);color:var(--ink);padding:10px 22px;border-radius:99px;font-size:13px;font-weight:500;opacity:0;transition:all .3s;z-index:300;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.4);`;document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';clearTimeout(t._timer);t._timer=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(10px)';},3000);}


function toggleHabit(id){
  const h=data.habits.find(x=>x.id===id);
  if(!h)return;
  const today=todayISO();
  const idx=h.history.indexOf(today);
  if(idx===-1){
    h.history.push(today);
    // calc streak simple
    h.streak++;
  } else {
    h.history.splice(idx,1);
    h.streak = Math.max(0, h.streak-1);
  }
  saveData(); render();
}

  if(!data.subjects) data.subjects=[];
  data.subjects.push({id:uid(), name:n, grades:[]});

}
function addGrade(subId){
  const sub = data.subjects.find(s=>s.id===subId);
  if(!sub) return;
  const n = prompt('Nome da avaliação (ex: Teste 1):');
  if(!n) return;
  const v = parseFloat(prompt('Nota (ex: 15.5):'));
  if(isNaN(v)) return;
  const w = parseFloat(prompt('Peso em % (ex: 40):'));
  if(isNaN(w)) return;
  sub.grades.push({name:n, value:v, weight:w});
  saveData(); render();
}
function delGrade(subId, idx){
  const sub = data.subjects.find(s=>s.id===subId);
  if(!sub) return;
  sub.grades.splice(idx,1);
  saveData(); render();
}
